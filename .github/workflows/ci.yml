name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile shared module
        run: ./gradlew :shared:compileDebugKotlinAndroid --stacktrace

      - name: Run unit tests
        run: ./gradlew :shared:testDebugUnitTest :composeApp:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew :composeApp:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/lint-results-debug.txt
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: ignore
